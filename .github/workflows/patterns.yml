# Records what the parking feeds say, twice an hour, forever.
#
# The app can tell you there are 14 spaces now; this is what lets it tell you
# whether 14 is normal for a Friday evening. Each run folds one sample into one
# bucket (day type x hour) and rewrites a single ~7 KB file, so the history
# costs the repository about 150-300 KB a day.
#
# GitHub disables scheduled workflows in a public repository after 60 days
# without repository activity. The "patterns:" commits this job pushes count as
# activity, so it keeps itself alive for as long as it keeps committing. The
# last step turns the run red (GitHub then emails agsm26) once main has had no
# commit for 3 days, long before that limit.
# If it is ever disabled: Actions tab > patterns > "Enable workflow"
# ("Run workflow" is hidden while it is disabled).
name: patterns
on:
  schedule:
    # Twice an hour, away from the top of the hour: at :07 GitHub ran only about
    # 1 in 4 of the hourly runs, and some Hong Kong hours were never sampled.
    - cron: "17,47 * * * *"   # UTC; the script converts to Hong Kong time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patterns           # never let two runs write the same slice
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Sample the feeds
        run: node collect_patterns.mjs
      - name: Commit the slice
        run: |
          if [ -z "$(git status --porcelain data/patterns)" ]; then
            echo "nothing changed (the feeds gave nothing this hour)"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/patterns
          git commit -m "patterns: $(date -u '+%Y-%m-%d %H:%M') UTC sample"
          # A person may have uploaded files in the meantime; rebase rather than clobber.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "could not push after 3 tries"; exit 1
      - name: Alarm if main has gone quiet
        # After a push, HEAD is that new commit; when the feeds gave nothing, it is
        # the newest commit anyone made. Either way its age says how long main has
        # been quiet.
        run: |
          age_h=$(( ( $(date +%s) - $(git log -1 --format=%ct HEAD) ) / 3600 ))
          echo "newest commit on main is ${age_h} h old"
          if [ "$age_h" -gt 72 ]; then
            echo "::error::Nothing committed to main for ${age_h} hours. GitHub disables this schedule after 60 days without a commit: check the feeds and collect_patterns.mjs."
            exit 1
          fi
